<title id="zonefig-title">The four KS1970 zones over Bulgaria</title>
<desc id="zonefig-desc">Map of the four Coordinate System 1970 Lambert zones K3, K5, K7 and K9, drawn from their official extents, with the 24 degrees east meridian highlighted as the line along which the transformation is discontinuous in the two western zones.</desc>
