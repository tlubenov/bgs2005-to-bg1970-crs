<svg viewBox="0 0 900 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="seamfig-title seamfig-desc" class="seamchart" style="max-width:100%;height:auto;">
<title id="seamfig-title">Curvature of AGKK’s transformation across each zone</title>
<desc id="seamfig-desc">Second difference of the transformed coordinates along each lattice row, per easting column, on a logarithmic scale. Zones K5 and K7 are flat at about half a millimetre and two and a half millimetres respectively. Zones K3 and K9 are equally flat except for a single spike reaching about 100 and 130 millimetres exactly at the 24 degrees east meridian.</desc>
