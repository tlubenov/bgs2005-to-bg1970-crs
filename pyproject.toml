[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgks1970"
version = "1.0.0"
description = "Recover Bulgaria's unpublished KS1970 Lambert zones (K3/K5/K7/K9) from BGS2005/CCS2005"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Todor Lubenov", email = "tlubenov@gmail.com" }]
keywords = ["geodesy", "gis", "proj", "bulgaria", "cadastre", "coordinate-transformation", "ks1970", "bgs2005"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

# GDAL is deliberately NOT a dependency: pip-installing it requires an exact match
# with the system libgdal, which usually fails. Install it from your OS package
# manager (apt install python3-gdal) or conda-forge. See README, "Installing PROJ".
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.6",   # must be built against PROJ >= 7.2 for the tinshift operator
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tlubenov/bgs2005-to-bg1970-crs"
Source = "https://github.com/tlubenov/bgs2005-to-bg1970-crs"

[project.scripts]
bgks1970 = "bgks1970.cli:main"

[tool.setuptools]
packages = ["bgks1970"]

[tool.pytest.ini_options]
testpaths = ["tests"]
